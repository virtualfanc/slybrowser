server {
    listen 80;
    listen [::]:80;
    server_name slybrowser.com www.slybrowser.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/slybrowser.com/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://slybrowser.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.slybrowser.com;

    ssl_certificate /www/server/panel/vhost/cert/slybrowser.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/slybrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://slybrowser.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slybrowser.com;

    ssl_certificate /www/server/panel/vhost/cert/slybrowser.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/slybrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/slybrowser.com/current;
    index index.html;
    server_tokens off;

    access_log /www/wwwlogs/slybrowser.com.log;
    error_log /www/wwwlogs/slybrowser.com.error.log;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
