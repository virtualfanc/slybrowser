server {
    listen 80;
    listen [::]:80;
    server_name slybrowser.com www.slybrowser.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/slybrowser.com/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://slybrowser.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.slybrowser.com;

    ssl_certificate /www/server/panel/vhost/cert/slybrowser.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/slybrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://slybrowser.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slybrowser.com;

    ssl_certificate /www/server/panel/vhost/cert/slybrowser.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/slybrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/slybrowser.com/current;
    index index.html;
    server_tokens off;

    access_log /www/wwwlogs/slybrowser.com.log;
    error_log /www/wwwlogs/slybrowser.com.error.log;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://api.slybrowser.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; img-src 'self' data: https://www.google-analytics.com; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.paynow.store https://checkout.paynow.gg; upgrade-insecure-requests" always;

    location = /visitor-region {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://api.slybrowser.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; img-src 'self' data: https://www.google-analytics.com; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.paynow.store https://checkout.paynow.gg; upgrade-insecure-requests" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Vary "CF-IPCountry" always;
        return 200 "{\"country\":\"$http_cf_ipcountry\"}";
    }

    location = /v1/billing/checkout-intents {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/v1/billing/checkout-intents/ci_[A-Za-z0-9_-]+/status$ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/v1/billing/orders/spo_[A-Za-z0-9_-]+/(?:status|license-resend|cancel-subscription)$ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Sly-Customer-Access-Token $http_x_sly_customer_access_token;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/feedback {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://api.slybrowser.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; img-src 'self' data: https://www.google-analytics.com; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.paynow.store https://checkout.paynow.gg; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        expires 1y;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://api.slybrowser.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; img-src 'self' data: https://www.google-analytics.com; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.paynow.store https://checkout.paynow.gg; upgrade-insecure-requests" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
