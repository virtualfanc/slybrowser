server {
    listen 80;
    listen [::]:80;
    server_name api.slybrowser.com;

    add_header Cache-Control "no-store, private, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/slybrowser.com/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://api.slybrowser.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.slybrowser.com;

    ssl_certificate /www/server/panel/vhost/cert/api.slybrowser.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.slybrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /www/wwwlogs/api.slybrowser.com.log;
    error_log /www/wwwlogs/api.slybrowser.com.error.log;

    add_header Cache-Control "no-store, private, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"reserved","service":"slybrowser-api"}\n';
    }

    location = /v1/billing/healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/billing/paynow/webhook {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_implemented"}\n';
    }
}
