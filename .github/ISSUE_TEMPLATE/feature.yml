name: Feature request
description: Propose a focused SDK, browser, or tooling improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python SDK
        - Node.js SDK
        - .NET SDK
        - Browser behavior
        - Build and release
        - Documentation
    validations:
      required: true
