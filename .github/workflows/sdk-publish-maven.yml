name: Publish Java SDK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact GitHub release tag
        required: true
        default: sdk-v0.2.0

concurrency:
  group: sdk-publish-maven-0.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      AUTHORIZATION_SHA256: ${{ vars.SDK_RELEASE_AUTHORIZATION_SHA256 }}
    steps:
      - name: Check out the protected workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the protected candidate authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RELEASE_TAG" = "sdk-v0.2.0"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP" --pattern sdk-release-authorization.json
          node scripts/release/Verify-SdkReleaseAuthorization.mjs --authorization "$RUNNER_TEMP/sdk-release-authorization.json" --expected-sha256 "$AUTHORIZATION_SHA256" --release-tag "$RELEASE_TAG" --github-env "$GITHUB_ENV"
      - name: Check out the authorized release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Download and verify the frozen release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          mkdir -p download/sdk
          gh release download "$RELEASE_TAG" --dir download --pattern sdk-release-set.json
          gh release download "$RELEASE_TAG" --dir download/sdk --pattern 'slybrowser-0.2.0.tgz' --pattern 'slybrowser-0.2.0-py3-none-any.whl' --pattern 'slybrowser-0.2.0.tar.gz' --pattern 'slybrowser-0.2.0.jar' --pattern 'slybrowser-0.2.0-sources.jar' --pattern 'slybrowser-0.2.0-javadoc.jar' --pattern 'slybrowser-0.2.0.pom' --pattern 'SlyBrowser.0.2.0.nupkg'
          node scripts/release/Verify-SdkReleaseSet.mjs --release-set download/sdk-release-set.json --artifact-root download/sdk --flat-artifacts --expected-sdk-set-id "$EXPECTED_SDK_SET_ID" --expected-source-tree "$(git rev-parse HEAD^{tree})"
      - name: Import the protected Maven signing key
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish the frozen Maven Central bundle and verify PUBLISHED readback
        shell: pwsh
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ secrets.MAVEN_GPG_FINGERPRINT }}
        run: |
          node ./scripts/release/Verify-MavenPublishEnvironment.mjs
          ./scripts/release/Publish-FrozenMavenCentral.ps1 -ReleaseSet download/sdk-release-set.json -ArtifactRoot download/sdk -ExpectedSdkSetId "$env:EXPECTED_SDK_SET_ID" -ExpectedSourceTree "$(git rev-parse HEAD^{tree})"
