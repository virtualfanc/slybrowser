name: Public delivery gate harness

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the frozen candidate compatibility matrix
        type: boolean
        default: false
      candidate_sha:
        description: Exact checked-out SHA for full qualification
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: delivery-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Delivery scope
    runs-on: ubuntu-latest
    outputs:
      delivery: ${{ steps.select.outputs.delivery }}
      delivery_matrix: ${{ steps.select.outputs.delivery_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for this change
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_MATRIX: ${{ inputs.full_matrix || 'false' }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
        run: |
          args=()
          if [[ "$FULL_MATRIX" == "true" ]]; then args+=(--full --candidate "$CANDIDATE_SHA"); fi
          node scripts/ci/select-checks.mjs --base "$BASE_SHA" --head "$HEAD_SHA" "${args[@]}"

  three-level-harness:
    name: ${{ matrix.os }} / delivery unit, integration, E2E
    if: ${{ needs.scope.outputs.delivery == 'true' }}
    needs: [scope]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.delivery_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.version }}
      - name: Run affected delivery layers once on this system
        run: node --test tests/delivery/unit.test.mjs tests/delivery/integration.test.mjs tests/delivery/e2e.test.mjs

  harness-summary:
    name: Delivery gate harness summary
    if: ${{ always() }}
    needs: [scope, three-level-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DELIVERY_SELECTED: ${{ needs.scope.outputs.delivery }}
          DELIVERY_RESULT: ${{ needs.three-level-harness.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$DELIVERY_SELECTED" == true ]]; then test "$DELIVERY_RESULT" = success; fi

# Local CI selects affected work. Full frozen-candidate qualification and online
# acceptance retain their separate identity-bound receipts and target checks.
